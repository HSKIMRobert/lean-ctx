name: Secret Rotation Check

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-rotation:
    name: Check secret expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check secret rotation status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/check-secret-expiry.py check
          --policy security/secret-rotation-policy-v1.json
          --repo yvgude/lean-ctx
          --output secret-rotation-report.json

      - name: Upload rotation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-rotation-report
          path: secret-rotation-report.json

      - name: Report summary
        if: always()
        run: >-
          python3 scripts/check-secret-expiry.py report
          --policy security/secret-rotation-policy-v1.json
          --input secret-rotation-report.json
          >> $GITHUB_STEP_SUMMARY
