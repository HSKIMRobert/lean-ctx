name: Benchmark Study

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated benchmark suites (humaneval, mbpp, swebench)'
        required: true
        default: 'humaneval'
        type: string
      arms:
        description: 'Comma-separated arms (control, compress, route, combined)'
        required: true
        default: 'control,compress,route,combined'
        type: string
      reference_model:
        description: 'Reference model for control/compress arms'
        required: true
        default: 'claude-sonnet-4'
        type: string
      repeats:
        description: 'Number of repeats per task'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

env:
  LEAN_CTX_DISABLED: '1'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  CARGO_TERM_COLOR: always

jobs:
  study:
    name: Run benchmark study
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: benchmark-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build
        working-directory: rust
        run: cargo build --release --lib

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run benchmark study
        working-directory: rust
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEAN_CTX_EVAL_MODEL: ${{ inputs.reference_model }}
        run: |
          cargo run --release -- benchmark study \
            --suite "${{ inputs.suites }}" \
            --arms "${{ inputs.arms }}" \
            --model "${{ inputs.reference_model }}" \
            --repeats "${{ inputs.repeats }}" \
            --json \
            --output ../benchmark-report.json

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.json
          retention-days: 90

      - name: Quality gate
        working-directory: rust
        run: |
          cargo run --release -- benchmark study \
            --suite "${{ inputs.suites }}" \
            --arms "control,combined" \
            --model "${{ inputs.reference_model }}" \
            --repeats 1 \
            --output /dev/null
