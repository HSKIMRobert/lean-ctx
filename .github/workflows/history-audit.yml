name: Full History Audit

on:
  schedule:
    - cron: '0 4 * * 1' # Weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-audit:
    name: Full history audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run full history audit
        run: >-
          python3 scripts/history-policy-gate.py full-audit --root .
          --policy security/history-policy-v1.json
          --output full-audit-report.json

      - name: Generate audit summary
        if: always()
        run: >-
          python3 scripts/generate-audit-report.py summarize
          --input full-audit-report.json
          --schedule security/audit-schedule-v1.json
          >> $GITHUB_STEP_SUMMARY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-history-audit
          path: full-audit-report.json
          retention-days: 90

      - name: Check for new findings
        run: >-
          python3 scripts/generate-audit-report.py check
          --input full-audit-report.json
          --baseline security/evidence/full-history-baseline-v1.json
