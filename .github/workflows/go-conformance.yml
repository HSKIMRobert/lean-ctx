name: Go SDK Conformance

on:
  push:
    branches: [main]
    paths:
      - go-sdk/**
      - docs/contracts/ocla-wire-v1.schema.json
  pull_request:
    paths:
      - go-sdk/**
      - docs/contracts/ocla-wire-v1.schema.json

permissions:
  contents: read

jobs:
  conformance:
    name: Go conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go-sdk
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5 # v5
        with:
          go-version: '1.22'
          cache-dependency-path: go-sdk/go.sum
      - name: Run conformance tests
        run: go test -v -run TestConformance ./...
